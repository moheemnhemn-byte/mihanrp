name: Build NAVARA Mobile APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract mobile project
        shell: bash
        run: |
          set -e

          ZIP="$(find . -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

          APP="$(find project -type f -name 'gradlew' -print -quit | xargs -r dirname)"

          if [ -z "$APP" ] || [ ! -f "$APP/gradlew" ]; then
            echo "ERROR: Android Gradle project not found."

            echo "Project files:"
            find project -maxdepth 5 -type f | head -n 200

            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$APP"

          WIDGETS="$APP/app/src/main/cpp/samp/gui/samp_widgets"
          GAME="$APP/app/src/main/cpp/samp/game"

          echo "Widgets folder:"
          ls -la "$WIDGETS"

          echo "Game folder:"
          ls -la "$GAME"

          # إصلاح اختلاف حالة الأحرف في Linux
          if [ -f "$WIDGETS/playertablist.h" ]; then
            rm -f "$WIDGETS/playerTabList.h"
            ln -s playertablist.h "$WIDGETS/playerTabList.h"
            echo "Created playerTabList.h compatibility link."
          fi

          if [ -f "$GAME/rgba.h" ]; then
            rm -f "$GAME/RGBA.h"
            ln -s rgba.h "$GAME/RGBA.h"
            echo "Created RGBA.h compatibility link."
          fi

          # استخدام ملفات الكيبورد الموجودة في المستودع إذا كانت موجودة
          if [ -f "app/src/main/cpp/samp/gui/samp_widgets/keyboard.h" ]; then
            cp "app/src/main/cpp/samp/gui/samp_widgets/keyboard.h" \
              "$WIDGETS/keyboard.h"
            echo "Updated keyboard.h"
          fi

          if [ -f "app/src/main/cpp/samp/gui/samp_widgets/keyboard.cpp" ]; then
            cp "app/src/main/cpp/samp/gui/samp_widgets/keyboard.cpp" \
              "$WIDGETS/keyboard.cpp"
            echo "Updated keyboard.cpp"
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Check project
        working-directory: ${{ env.APP }}
        shell: bash
        run: |
          set -e

          echo "Gradle version:"
          ./gradlew --version

          echo "Android project:"
          pwd

          echo "Gradle files:"
          find . -maxdepth 3 \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print

      - name: Build Debug APK
        working-directory: ${{ env.APP }}
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find "${APP}/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find "${APP}/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p release

          cp "$APK" release/NAVARA-RP.apk

          echo "Final APK:"
          ls -lh release/NAVARA-RP.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NAVARA-RP-Mobile-APK
          path: release/NAVARA-RP.apk
          if-no-files-found: error
