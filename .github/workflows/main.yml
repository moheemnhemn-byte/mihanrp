name: Build NAVARA Mobile APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Android project
        shell: bash
        run: |
          set -e

          APP=""

          if [ -f "./android/gradlew" ]; then
            APP="./android"
          elif [ -f "./gradlew" ]; then
            APP="."
          else
            APP="$(find . -type f -name 'gradlew' -print -quit | xargs -r dirname)"
          fi

          if [ -z "$APP" ] || [ ! -f "$APP/gradlew" ]; then
            echo "ERROR: Android Gradle project not found."

            echo "Repository files:"
            find . -maxdepth 4 -type f | head -n 300

            exit 1
          fi

          APP="$(cd "$APP" && pwd)"

          echo "APP=$APP" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$APP"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Check Android project
        working-directory: ${{ env.APP }}
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          echo "Gradle version:"
          ./gradlew --version

          echo "Android project:"
          pwd

          echo "Gradle files:"
          find . -maxdepth 3 \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print

      - name: Build Debug APK
        working-directory: ${{ env.APP }}
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find "${APP}/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find "${APP}/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p release

          cp "$APK" release/NAVARA-RP.apk

          echo "Final APK:"
          ls -lh release/NAVARA-RP.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NAVARA-RP-Mobile-APK
          path: release/NAVARA-RP.apk
          if-no-files-found: error
