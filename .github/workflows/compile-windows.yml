name: Compile NAVARA Windows

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare includes
        shell: cmd
        run: |
          echo Searching for mxINI.inc...

          if exist "pawno\include\mxINI.inc" (
            echo Found mxINI.inc
            copy /Y "pawno\include\mxINI.inc" "pawno\include\mxini.inc"
          ) else if exist "pawno\include\mxini.inc" (
            echo Found mxini.inc
          ) else (
            echo ERROR: mxINI.inc was not found
            echo.
            echo Available INI files:
            dir /B "pawno\include\*ini*.inc"
            exit /b 1
          )

      - name: Compile new.pwn
        shell: cmd
        run: |
          set "ROOT=%CD%"
          set "COMPILER=%ROOT%\pawno\pawncc.exe"
          set "SOURCE=%ROOT%\gamemodes\new.pwn"
          set "INCLUDE=%ROOT%\pawno\include"
          set "OUTPUT=%ROOT%\gamemodes\new"

          echo ========================================
          echo NAVARA PAWN COMPILER
          echo ========================================

          if not exist "%COMPILER%" (
            echo ERROR: pawncc.exe not found
            exit /b 1
          )

          if not exist "%SOURCE%" (
            echo ERROR: new.pwn not found
            exit /b 1
          )

          "%COMPILER%" "%SOURCE%" "-i%INCLUDE%" "-i%ROOT%\gamemodes" "-o%OUTPUT%"

      - name: Verify AMX
        shell: cmd
        run: |
          if not exist "gamemodes\new.amx" (
            echo ERROR: new.amx was not created
            exit /b 1
          )

          echo ========================================
          echo SUCCESS!
          echo new.amx CREATED
          echo ========================================

          dir "gamemodes\new.amx"

      - name: Upload new.amx
        uses: actions/upload-artifact@v4
        with:
          name: NAVARA-new-amx
          path: gamemodes/new.amx
          if-no-files-found: error
