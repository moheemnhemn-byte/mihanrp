name: Compile NAVARA Pawn

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest

    steps:

      # ==========================================
      # 1. تحميل المشروع
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. تنزيل Pawn Community Compiler 3.10.10
      # ==========================================
      - name: Install Pawn Compiler 3.10.10
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawn-3.10.10-win32.zip"
          $zip = "$env:RUNNER_TEMP\pawncc.zip"
          $compilerDir = "$env:GITHUB_WORKSPACE\compiler"

          Write-Host "Downloading Pawn Community Compiler 3.10.10..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $zip `
            -UseBasicParsing

          if (!(Test-Path $zip)) {
            Write-Host "ERROR: Compiler ZIP was not downloaded."
            exit 1
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $compilerDir | Out-Null

          Expand-Archive `
            -Path $zip `
            -DestinationPath $compilerDir `
            -Force

          Write-Host ""
          Write-Host "Compiler files:"
          Get-ChildItem `
            -Path $compilerDir `
            -Recurse `
            -File |
            Select-Object FullName

      # ==========================================
      # 3. العثور على pawncc.exe
      # ==========================================
      - name: Find compiler
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $compiler = Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE\compiler" `
            -Recurse `
            -Filter "pawncc.exe" `
            -File |
            Select-Object -First 1

          if ($null -eq $compiler) {
            Write-Host "ERROR: pawncc.exe was not found."
            exit 1
          }

          "PAWNCC=$($compiler.FullName)" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "Using compiler:"
          Write-Host $compiler.FullName

      # ==========================================
      # 4. تجهيز mxINI
      # ==========================================
      - name: Install mxINI
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $include = "$env:GITHUB_WORKSPACE\pawno\include"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $include | Out-Null

          $mxini = "$include\mxini.inc"

          $url = "https://raw.githubusercontent.com/Open-GTO/mxINI/master/mxINI.inc"

          Write-Host "Downloading mxINI.inc..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $mxini `
            -UseBasicParsing

          if (!(Test-Path $mxini)) {
            Write-Host "ERROR: mxini.inc was not downloaded."
            exit 1
          }

          Write-Host "mxini.inc installed successfully."

      # ==========================================
      # 5. فحص الملفات
      # ==========================================
      - name: Check project
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $source = "$env:GITHUB_WORKSPACE\gamemodes\new.pwn"
          $include = "$env:GITHUB_WORKSPACE\pawno\include"
          $mxini = "$include\mxini.inc"

          Write-Host ""
          Write-Host "========== PROJECT CHECK =========="

          if (!(Test-Path $source)) {
            Write-Host "ERROR: gamemodes\new.pwn was not found."
            exit 1
          }

          if (!(Test-Path $mxini)) {
            Write-Host "ERROR: mxini.inc was not found."
            exit 1
          }

          Write-Host "new.pwn  : OK"
          Write-Host "mxini    : OK"
          Write-Host "==================================="

      # ==========================================
      # 6. Compile
      # ==========================================
      - name: Compile new.pwn
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $source = "$env:GITHUB_WORKSPACE\gamemodes\new.pwn"
          $include = "$env:GITHUB_WORKSPACE\pawno\include"
          $game = "$env:GITHUB_WORKSPACE\gamemodes"
          $root = "$env:GITHUB_WORKSPACE"

          Write-Host ""
          Write-Host "======================================"
          Write-Host "       NAVARA PAWN COMPILATION"
          Write-Host "======================================"
          Write-Host ""
          Write-Host "Compiler:"
          Write-Host $env:PAWNCC
          Write-Host ""
          Write-Host "Source:"
          Write-Host $source
          Write-Host ""
          Write-Host "Include:"
          Write-Host $include
          Write-Host ""
          Write-Host "======================================"
          Write-Host ""

          & $env:PAWNCC `
            $source `
            "-i$include" `
            "-i$game" `
            "-i$root" `
            "-Z"

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Compiler exit code: $exitCode"

          if ($exitCode -ne 0) {
            Write-Host ""
            Write-Host "======================================"
            Write-Host "       COMPILATION FAILED"
            Write-Host "======================================"
            exit $exitCode
          }

      # ==========================================
      # 7. التأكد من إنشاء new.amx
      # ==========================================
      - name: Verify new.amx
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $amx = "$env:GITHUB_WORKSPACE\gamemodes\new.amx"

          Write-Host ""
          Write-Host "========== AMX CHECK =========="

          if (!(Test-Path $amx)) {
            Write-Host "ERROR: new.amx was NOT created."
            Write-Host ""
            Write-Host "Gamemodes directory:"
            Get-ChildItem `
              "$env:GITHUB_WORKSPACE\gamemodes" |
              Select-Object Name, Length

            exit 1
          }

          $size = (Get-Item $amx).Length

          Write-Host "SUCCESS!"
          Write-Host ""
          Write-Host "new.amx created successfully."
          Write-Host "Size: $size bytes"
          Write-Host ""
          Write-Host "================================"

      # ==========================================
      # 8. رفع new.amx
      # ==========================================
      - name: Upload new.amx
        uses: actions/upload-artifact@v4
        with:
          name: NAVARA-new-amx
          path: gamemodes/new.amx
          if-no-files-found: error
