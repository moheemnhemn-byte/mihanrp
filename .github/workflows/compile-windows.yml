name: Compile NAVARA Pawn

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Pawn Compiler
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-windows.zip"
          $zip = "$env:RUNNER_TEMP\pawnc.zip"
          $dir = "$env:GITHUB_WORKSPACE\pawn-compiler"

          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing

          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          Expand-Archive -Path $zip -DestinationPath $dir -Force

          Write-Host "Compiler downloaded."

      - name: Locate Compiler
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $root = "$env:GITHUB_WORKSPACE\pawn-compiler"

          $pawncc = Get-ChildItem `
            $root `
            -Recurse `
            -Filter "pawncc.exe" `
            -File |
            Select-Object -First 1

          if ($null -eq $pawncc) {
            Write-Host "pawncc.exe not found."
            exit 1
          }

          $dll = Join-Path $pawncc.Directory.FullName "pawnc.dll"

          if (!(Test-Path $dll)) {
            Write-Host "pawnc.dll not found."
            exit 1
          }

          Write-Host "Compiler:"
          Write-Host $pawncc.FullName

          "PAWNCC=$($pawncc.FullName)" >> $env:GITHUB_ENV

      - name: Install mxINI
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $include = "$env:GITHUB_WORKSPACE\pawno\include"

          New-Item -ItemType Directory -Force -Path $include | Out-Null

          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/Open-GTO/mxINI/master/mxINI.inc" `
            -OutFile "$include\mxini.inc" `
            -UseBasicParsing

          Write-Host "mxINI installed."

      # ==========================================
      # اختبار Compiler بملف صغير جداً
      # ==========================================
      - name: Test Compiler
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $test = "$env:RUNNER_TEMP\test.pwn"

          @"
          main()
          {
              print("NAVARA TEST");
          }
          "@ | Set-Content -Path $test -Encoding ASCII

          Write-Host "Testing Pawn Compiler..."

          & "$env:PAWNCC" "$test" "-Z"

          $code = $LASTEXITCODE

          Write-Host "Test exit code: $code"

          if ($code -ne 0) {
            Write-Host "COMPILER TEST FAILED."
            exit $code
          }

          Write-Host "COMPILER TEST PASSED."

      # ==========================================
      # Compile NAVARA
      # ==========================================
      - name: Compile new.pwn
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $source = "$env:GITHUB_WORKSPACE\gamemodes\new.pwn"
          $include = "$env:GITHUB_WORKSPACE\pawno\include"
          $output = "$env:GITHUB_WORKSPACE\gamemodes\new"

          if (!(Test-Path $source)) {
            Write-Host "new.pwn not found."
            exit 1
          }

          Write-Host "================================"
          Write-Host "COMPILING NAVARA"
          Write-Host "================================"

          & "$env:PAWNCC" `
            "$source" `
            "-i$include" `
            "-o$output" `
            "-Z"

          $code = $LASTEXITCODE

          Write-Host "Compiler exit code: $code"

          if ($code -ne 0) {
            Write-Host "NAVARA COMPILATION FAILED."
            exit $code
          }

          if (!(Test-Path "$env:GITHUB_WORKSPACE\gamemodes\new.amx")) {
            Write-Host "new.amx was not created."
            exit 1
          }

          Write-Host "================================"
          Write-Host "SUCCESS - new.amx CREATED"
          Write-Host "================================"

      - name: Upload new.amx
        uses: actions/upload-artifact@v4
        with:
          name: new-amx
          path: gamemodes/new.amx
