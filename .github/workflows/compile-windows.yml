name: Compile NAVARA Pawn

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest

    steps:
      # ==============================
      # 1. تحميل المشروع
      # ==============================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==============================
      # 2. تجهيز المجلدات
      # ==============================
      - name: Prepare folders
        shell: powershell
        run: |
          $root = (Get-Location).Path

          Write-Host "Project root:"
          Write-Host $root

          New-Item -ItemType Directory -Force -Path "$root\pawno\include" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root\gamemodes" | Out-Null

      # ==============================
      # 3. تنزيل mxINI.inc
      # ==============================
      - name: Install mxINI
        shell: powershell
        run: |
          $url = "https://raw.githubusercontent.com/Open-GTO/mxINI/master/mxINI.inc"
          $destination = "$env:GITHUB_WORKSPACE\pawno\include\mxini.inc"

          Write-Host "Downloading mxINI.inc..."
          Invoke-WebRequest `
            -Uri $url `
            -OutFile $destination `
            -UseBasicParsing

          if (!(Test-Path $destination)) {
            Write-Host "ERROR: mxINI.inc was not downloaded."
            exit 1
          }

          Write-Host "mxINI installed successfully:"
          Write-Host $destination

      # ==============================
      # 4. التحقق من الملفات
      # ==============================
      - name: Check required files
        shell: powershell
        run: |
          $root = $env:GITHUB_WORKSPACE

          $source = "$root\gamemodes\new.pwn"
          $compiler = "$root\pawno\pawncc.exe"
          $include = "$root\pawno\include"
          $mxini = "$include\mxini.inc"

          Write-Host ""
          Write-Host "========== FILE CHECK =========="

          if (!(Test-Path $source)) {
            Write-Host "ERROR: gamemodes\new.pwn not found."
            exit 1
          }

          if (!(Test-Path $compiler)) {
            Write-Host "ERROR: pawno\pawncc.exe not found."
            exit 1
          }

          if (!(Test-Path $mxini)) {
            Write-Host "ERROR: mxini.inc not found."
            exit 1
          }

          Write-Host "new.pwn      : OK"
          Write-Host "pawncc.exe   : OK"
          Write-Host "mxini.inc    : OK"
          Write-Host "================================"
          Write-Host ""

      # ==============================
      # 5. Compile new.pwn
      # ==============================
      - name: Compile new.pwn
        shell: powershell
        run: |
          $root = $env:GITHUB_WORKSPACE

          $compiler = "$root\pawno\pawncc.exe"
          $source = "$root\gamemodes\new.pwn"
          $include = "$root\pawno\include"
          $output = "$root\gamemodes\new"

          Write-Host ""
          Write-Host "========== COMPILING =========="
          Write-Host "Compiler : $compiler"
          Write-Host "Source   : $source"
          Write-Host "Include  : $include"
          Write-Host "Output   : $output"
          Write-Host "==============================="
          Write-Host ""

          & $compiler `
            $source `
            "-i$include" `
            "-i$root\gamemodes" `
            "-i$root"

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Compiler exit code: $exitCode"

          if ($exitCode -ne 0) {
            Write-Host ""
            Write-Host "COMPILATION FAILED."
            exit $exitCode
          }

      # ==============================
      # 6. البحث عن AMX
      # ==============================
      - name: Verify AMX
        shell: powershell
        run: |
          $root = $env:GITHUB_WORKSPACE
          $amx = "$root\gamemodes\new.amx"

          Write-Host ""
          Write-Host "========== AMX CHECK =========="

          if (!(Test-Path $amx)) {
            Write-Host "ERROR: new.amx was not created."
            Write-Host ""
            Write-Host "Files inside gamemodes:"
            Get-ChildItem "$root\gamemodes" | Select-Object Name, Length
            exit 1
          }

          $size = (Get-Item $amx).Length

          Write-Host "SUCCESS!"
          Write-Host "new.amx created."
          Write-Host "Size: $size bytes"
          Write-Host "================================"

      # ==============================
      # 7. رفع new.amx كـ Artifact
      # ==============================
      - name: Upload new.amx
        uses: actions/upload-artifact@v4
        with:
          name: NAVARA-new-amx
          path: gamemodes/new.amx
          if-no-files-found: error
