name: Compile NAVARA Pawn

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # تحميل Pawn Compiler Windows 3.10.10
      # ==========================================
      - name: Download Pawn Compiler
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-windows.zip"

          $zip = "$env:RUNNER_TEMP\pawnc.zip"
          $dir = "$env:GITHUB_WORKSPACE\pawn-compiler"

          Write-Host "Downloading Pawn Compiler..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $zip `
            -UseBasicParsing

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $dir | Out-Null

          Expand-Archive `
            -Path $zip `
            -DestinationPath $dir `
            -Force

          Write-Host "Compiler extracted."

      # ==========================================
      # إيجاد pawncc.exe و pawnc.dll
      # ==========================================
      - name: Locate Compiler
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $compilerRoot = "$env:GITHUB_WORKSPACE\pawn-compiler"

          $pawncc = Get-ChildItem `
            $compilerRoot `
            -Recurse `
            -Filter "pawncc.exe" `
            -File |
            Select-Object -First 1

          if ($null -eq $pawncc) {
            Write-Host "ERROR: pawncc.exe not found."
            Write-Host "Available compiler files:"
            Get-ChildItem $compilerRoot -Recurse |
              Select-Object FullName
            exit 1
          }

          $compilerDir = $pawncc.Directory.FullName

          Write-Host "================================"
          Write-Host "FOUND pawncc.exe:"
          Write-Host $pawncc.FullName
          Write-Host "================================"

          # البحث عن pawnc.dll
          $pawnc = Get-ChildItem `
            $compilerRoot `
            -Recurse `
            -Filter "pawnc.dll" `
            -File |
            Select-Object -First 1

          if ($null -eq $pawnc) {
            Write-Host "ERROR: pawnc.dll not found."
            exit 1
          }

          $targetDll = Join-Path $compilerDir "pawnc.dll"

          # لا تنسخ الملف إذا هو موجود بنفس المكان
          if ($pawnc.FullName -ne $targetDll) {

            Copy-Item `
              $pawnc.FullName `
              $targetDll `
              -Force

            Write-Host "pawnc.dll copied."

          } else {

            Write-Host "pawnc.dll already exists beside pawncc.exe."

          }

          # حفظ مسار Compiler للخطوة القادمة
          "PAWNCC=$($pawncc.FullName)" >> $env:GITHUB_ENV

      # ==========================================
      # تثبيت mxINI
      # ==========================================
      - name: Install mxINI
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $includeDir = "$env:GITHUB_WORKSPACE\pawno\include"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $includeDir | Out-Null

          $url = "https://raw.githubusercontent.com/Open-GTO/mxINI/master/mxINI.inc"

          $out = "$includeDir\mxini.inc"

          Write-Host "Downloading mxINI..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $out `
            -UseBasicParsing

          if (!(Test-Path $out)) {
            Write-Host "ERROR: mxINI.inc was not created."
            exit 1
          }

          Write-Host "mxINI installed successfully."

      # ==========================================
      # Compile new.pwn
      # ==========================================
      - name: Compile new.pwn
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $source = "$env:GITHUB_WORKSPACE\gamemodes\new.pwn"
          $include = "$env:GITHUB_WORKSPACE\pawno\include"

          if (!(Test-Path $source)) {
            Write-Host "ERROR: gamemodes\new.pwn not found."
            exit 1
          }

          Write-Host "================================"
          Write-Host "Compiler:"
          Write-Host $env:PAWNCC
          Write-Host "================================"

          Write-Host "Source:"
          Write-Host $source

          Write-Host "================================"
          Write-Host "Starting compilation..."
          Write-Host "================================"

          & "$env:PAWNCC" `
            "$source" `
            "-i$include"

          $exitCode = $LASTEXITCODE

          Write-Host "Compiler exit code: $exitCode"

          if ($exitCode -ne 0) {
            Write-Host "COMPILATION FAILED."
            exit $exitCode
          }

          # ======================================
          # التأكد من إنشاء new.amx
          # ======================================

          $amx = "$env:GITHUB_WORKSPACE\gamemodes\new.amx"

          if (!(Test-Path $amx)) {
            Write-Host "ERROR: new.amx was not created."
            exit 1
          }

          Write-Host "================================"
          Write-Host "SUCCESS!"
          Write-Host "new.amx created successfully."
          Write-Host "================================"

      # ==========================================
      # رفع new.amx للتحميل
      # ==========================================
      - name: Upload new.amx
        uses: actions/upload-artifact@v4
        with:
          name: new-amx
          path: gamemodes/new.amx
