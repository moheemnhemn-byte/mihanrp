name: Compile NAVARA Pawn

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # تحميل Windows Pawn Compiler 3.10.10
      # ==========================================
      - name: Download Pawn Compiler
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-windows.zip"

          $zip = "$env:RUNNER_TEMP\pawnc.zip"
          $dir = "$env:GITHUB_WORKSPACE\pawn-compiler"

          Write-Host "Downloading Pawn Compiler..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $zip `
            -UseBasicParsing

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $dir | Out-Null

          Expand-Archive `
            -Path $zip `
            -DestinationPath $dir `
            -Force

          Write-Host "Compiler extracted."

      # ==========================================
      # العثور على Compiler
      # ==========================================
      - name: Locate Compiler
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $root = "$env:GITHUB_WORKSPACE\pawn-compiler"

          $pawncc = Get-ChildItem `
            $root `
            -Recurse `
            -Filter "pawncc.exe" `
            -File |
            Select-Object -First 1

          if ($null -eq $pawncc) {
            Write-Host "ERROR: pawncc.exe not found."
            exit 1
          }

          $compilerDir = $pawncc.Directory.FullName
          $dll = Join-Path $compilerDir "pawnc.dll"

          Write-Host "================================"
          Write-Host "FOUND pawncc.exe:"
          Write-Host $pawncc.FullName
          Write-Host "================================"

          if (!(Test-Path $dll)) {
            Write-Host "ERROR: pawnc.dll not found beside pawncc.exe."
            exit 1
          }

          Write-Host "pawnc.dll found."

          "PAWNCC=$($pawncc.FullName)" >> $env:GITHUB_ENV

      # ==========================================
      # اختبار Compiler فقط
      # ==========================================
      - name: Test Pawn Compiler
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "================================"
          Write-Host "TESTING PAWN COMPILER"
          Write-Host "================================"

          & "$env:PAWNCC" --version

          $code = $LASTEXITCODE

          Write-Host "Compiler test exit code: $code"

          if ($code -ne 0) {
            Write-Host "ERROR: Pawn compiler crashed or failed."
            exit $code
          }

          Write-Host "Pawn compiler test PASSED."

      # ==========================================
      # تثبيت mxINI
      # ==========================================
      - name: Install mxINI
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $include = "$env:GITHUB_WORKSPACE\pawno\include"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $include | Out-Null

          $url = "https://raw.githubusercontent.com/Open-GTO/mxINI/master/mxINI.inc"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "$include\mxini.inc" `
            -UseBasicParsing

          if (!(Test-Path "$include\mxini.inc")) {
            Write-Host "ERROR: mxini.inc was not installed."
            exit 1
          }

          Write-Host "mxINI installed successfully."

      # ==========================================
      # Compile new.pwn
      # ==========================================
      - name: Compile new.pwn
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $source = "$env:GITHUB_WORKSPACE\gamemodes\new.pwn"
          $include = "$env:GITHUB_WORKSPACE\pawno\include"

          if (!(Test-Path $source)) {
            Write-Host "ERROR: gamemodes\new.pwn not found."
            exit 1
          }

          Write-Host "================================"
          Write-Host "COMPILING new.pwn"
          Write-Host "================================"

          Write-Host "Compiler:"
          Write-Host $env:PAWNCC

          Write-Host "Source:"
          Write-Host $source

          & "$env:PAWNCC" `
            "$source" `
            "-i$include" `
            "-Z"

          $code = $LASTEXITCODE

          Write-Host "Compiler exit code: $code"

          if ($code -ne 0) {
            Write-Host "COMPILATION FAILED."
            exit $code
          }

          $amx = "$env:GITHUB_WORKSPACE\gamemodes\new.amx"

          if (!(Test-Path $amx)) {
            Write-Host "ERROR: new.amx was not created."
            exit 1
          }

          Write-Host "================================"
          Write-Host "SUCCESS!"
          Write-Host "new.amx CREATED."
          Write-Host "================================"

      # ==========================================
      # رفع new.amx
      # ==========================================
      - name: Upload new.amx
        uses: actions/upload-artifact@v4
        with:
          name: new-amx
          path: gamemodes/new.amx
