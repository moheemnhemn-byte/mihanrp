name: Compile NAVARA Pawn

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # تحميل Windows Compiler الصحيح
      - name: Download Pawn Compiler
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-windows.zip"

          $zip = "$env:RUNNER_TEMP\pawnc.zip"
          $dir = "$env:GITHUB_WORKSPACE\pawn-compiler"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $zip `
            -UseBasicParsing

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $dir | Out-Null

          Expand-Archive `
            -Path $zip `
            -DestinationPath $dir `
            -Force

          Write-Host "=== Compiler files ==="

          Get-ChildItem `
            $dir `
            -Recurse |
            Select-Object FullName

      # إيجاد Compiler
      - name: Locate Compiler
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $pawncc = Get-ChildItem `
            "$env:GITHUB_WORKSPACE\pawn-compiler" `
            -Recurse `
            -Filter "pawncc.exe" `
            -File |
            Select-Object -First 1

          if ($null -eq $pawncc) {
            Write-Host "ERROR: pawncc.exe not found."
            exit 1
          }

          Write-Host "FOUND:"
          Write-Host $pawncc.FullName

          $compilerDir = $pawncc.Directory.FullName

          $pawnc = Get-ChildItem `
            "$env:GITHUB_WORKSPACE\pawn-compiler" `
            -Recurse `
            -Filter "pawnc.dll" `
            -File |
            Select-Object -First 1

          if ($null -ne $pawnc) {
            Copy-Item `
              $pawnc.FullName `
              (Join-Path $compilerDir "pawnc.dll") `
              -Force

            Write-Host "pawnc.dll installed."
          }

          "PAWNCC=$($pawncc.FullName)" >> $env:GITHUB_ENV

      # تثبيت mxINI
      - name: Install mxINI
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://raw.githubusercontent.com/Open-GTO/mxINI/master/mxINI.inc"

          $out = "$env:GITHUB_WORKSPACE\pawno\include\mxini.inc"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $out `
            -UseBasicParsing

          Write-Host "mxINI installed."

      # Compile
      - name: Compile new.pwn
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $source = "$env:GITHUB_WORKSPACE\gamemodes\new.pwn"
          $include = "$env:GITHUB_WORKSPACE\pawno\include"

          Write-Host "Compiler:"
          Write-Host $env:PAWNCC

          Write-Host "Source:"
          Write-Host $source

          & "$env:PAWNCC" `
            "$source" `
            "-i$include"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "COMPILATION FAILED."
            exit $LASTEXITCODE
          }

          if (!(Test-Path "$env:GITHUB_WORKSPACE\gamemodes\new.amx")) {
            Write-Host "ERROR: new.amx was not created."
            exit 1
          }

          Write-Host "================================"
          Write-Host "SUCCESS: new.amx created!"
          Write-Host "================================"

      # إخراج new.amx للتحميل
      - name: Upload new.amx
        uses: actions/upload-artifact@v4
        with:
          name: new-amx
          path: gamemodes/new.amx
