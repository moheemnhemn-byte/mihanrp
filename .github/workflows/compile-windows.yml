name: Compile NAVARA Windows

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile new.pwn
        shell: cmd
        run: |
          set "ROOT=%CD%"
          set "COMPILER=%ROOT%\pawno\pawncc.exe"
          set "SOURCE=%ROOT%\gamemodes\new.pwn"
          set "INCLUDE=%ROOT%\pawno\include"
          set "OUTPUT=%ROOT%\gamemodes\new"

          if not exist "%COMPILER%" exit /b 1
          if not exist "%SOURCE%" exit /b 1
          if not exist "%INCLUDE%" exit /b 1

          "%COMPILER%" "%SOURCE%" "-i%INCLUDE%" "-i%ROOT%\gamemodes" "-o%OUTPUT%"

      - name: Verify
        shell: cmd
        run: |
          if not exist "gamemodes\new.amx" (
            echo ERROR: new.amx was not created
            exit /b 1
          )

          echo SUCCESS: new.amx created

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: NAVARA-new-amx
          path: gamemodes/new.amx
