name: Compile NAVARA Pawn

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest

    steps:

      # =========================================
      # 1. تحميل المشروع
      # =========================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================
      # 2. تحميل Pawn Compiler الرسمي
      # =========================================
      - name: Install Pawn Compiler
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $api = "https://api.github.com/repos/pawn-lang/compiler/releases/tags/v3.10.10"

          Write-Host "Getting Pawn Compiler 3.10.10..."

          $release = Invoke-RestMethod `
            -Uri $api `
            -Headers @{
              "User-Agent" = "GitHub-Actions"
            }

          Write-Host "Release: $($release.tag_name)"

          if ($null -eq $release.assets) {
            Write-Host "ERROR: No release assets found."
            exit 1
          }

          Write-Host ""
          Write-Host "Available files:"
          $release.assets | ForEach-Object {
            Write-Host $_.name
          }

          # ابحث عن حزمة Windows
          $asset = $release.assets |
            Where-Object {
              $_.name -match "\.zip$" -and
              $_.name -match "(win|windows)"
            } |
            Select-Object -First 1

          # إذا الاسم ما يحتوي Windows،
          # خذ أول ZIP رسمي
          if ($null -eq $asset) {
            $asset = $release.assets |
              Where-Object {
                $_.name -match "\.zip$"
              } |
              Select-Object -First 1
          }

          if ($null -eq $asset) {
            Write-Host ""
            Write-Host "ERROR: Windows compiler ZIP was not found."
            exit 1
          }

          Write-Host ""
          Write-Host "Selected:"
          Write-Host $asset.name
          Write-Host ""

          $zip = "$env:RUNNER_TEMP\pawn.zip"
          $dir = "$env:GITHUB_WORKSPACE\pawn-compiler"

          Invoke-WebRequest `
            -Uri $asset.browser_download_url `
            -OutFile $zip `
            -UseBasicParsing

          if (!(Test-Path $zip)) {
            Write-Host "ERROR: Download failed."
            exit 1
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $dir | Out-Null

          Expand-Archive `
            -Path $zip `
            -DestinationPath $dir `
            -Force

          Write-Host "Compiler extracted."


      # =========================================
      # 3. إيجاد pawncc.exe
      # =========================================
      - name: Locate pawncc
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $compiler = Get-ChildItem `
            "$env:GITHUB_WORKSPACE\pawn-compiler" `
            -Recurse `
            -Filter "pawncc.exe" `
            -File |
            Select-Object -First 1

          if ($null -eq $compiler) {
            Write-Host "ERROR: pawncc.exe not found."
            exit 1
          }

          $compilerPath = $compiler.FullName

          "PAWNCC=$compilerPath" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "Pawn compiler:"
          Write-Host $compilerPath


      # =========================================
      # 4. تجهيز include
      # =========================================
      - name: Prepare includes
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $include = "$env:GITHUB_WORKSPACE\pawno\include"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $include | Out-Null

          Write-Host "Include folder ready."


      # =========================================
      # 5. تنزيل mxINI.inc
      # =========================================
      - name: Install mxINI
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $destination =
            "$env:GITHUB_WORKSPACE\pawno\include\mxini.inc"

          $url =
            "https://raw.githubusercontent.com/Open-GTO/mxINI/master/mxINI.inc"

          Write-Host "Downloading mxINI.inc..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $destination `
            -UseBasicParsing

          if (!(Test-Path $destination)) {
            Write-Host "ERROR: mxini.inc not found."
            exit 1
          }

          Write-Host "mxINI.inc installed successfully."


      # =========================================
      # 6. فحص المشروع
      # =========================================
      - name: Check files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:GITHUB_WORKSPACE

          $source =
            "$root\gamemodes\new.pwn"

          $include =
            "$root\pawno\include"

          $mxini =
            "$include\mxini.inc"

          Write-Host ""
          Write-Host "=============================="
          Write-Host "       FILE CHECK"
          Write-Host "=============================="

          if (!(Test-Path $source)) {
            Write-Host "ERROR: new.pwn not found."
            exit 1
          }

          if (!(Test-Path $mxini)) {
            Write-Host "ERROR: mxini.inc not found."
            exit 1
          }

          if (!(Test-Path $env:PAWNCC)) {
            Write-Host "ERROR: pawncc.exe not found."
            exit 1
          }

          Write-Host "new.pwn    : OK"
          Write-Host "mxini.inc  : OK"
          Write-Host "pawncc.exe : OK"

          Write-Host "=============================="


      # =========================================
      # 7. Compile
      # =========================================
      - name: Compile new.pwn
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $root = $env:GITHUB_WORKSPACE

          $source =
            "$root\gamemodes\new.pwn"

          $include =
            "$root\pawno\include"

          $game =
            "$root\gamemodes"

          Write-Host ""
          Write-Host "===================================="
          Write-Host "       COMPILING NAVARA"
          Write-Host "===================================="
          Write-Host ""

          Write-Host "Compiler:"
          Write-Host $env:PAWNCC

          Write-Host ""
          Write-Host "Source:"
          Write-Host $source

          Write-Host ""
          Write-Host "Include:"
          Write-Host $include

          Write-Host ""
          Write-Host "===================================="
          Write-Host ""

          Push-Location $game

          & $env:PAWNCC `
            "new.pwn" `
            "-i$include" `
            "-i$game" `
            "-i$root" `
            "-Z"

          $code = $LASTEXITCODE

          Pop-Location

          Write-Host ""
          Write-Host "Compiler exit code: $code"

          if ($code -ne 0) {
            Write-Host ""
            Write-Host "COMPILATION FAILED."
            exit $code
          }


      # =========================================
      # 8. التأكد من AMX
      # =========================================
      - name: Verify AMX
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $amx =
            "$env:GITHUB_WORKSPACE\gamemodes\new.amx"

          Write-Host ""
          Write-Host "===================================="
          Write-Host "          CHECKING AMX"
          Write-Host "===================================="

          if (!(Test-Path $amx)) {
            Write-Host "ERROR: new.amx was not created."

            Write-Host ""
            Write-Host "gamemodes files:"

            Get-ChildItem `
              "$env:GITHUB_WORKSPACE\gamemodes" |
              Select-Object Name, Length

            exit 1
          }

          $size = (Get-Item $amx).Length

          Write-Host ""
          Write-Host "===================================="
          Write-Host "             SUCCESS"
          Write-Host "===================================="
          Write-Host ""
          Write-Host "new.amx created successfully!"
          Write-Host "Size: $size bytes"
          Write-Host ""


      # =========================================
      # 9. رفع الملف
      # =========================================
      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: NAVARA-new-amx
          path: gamemodes/new.amx
          if-no-files-found: error
