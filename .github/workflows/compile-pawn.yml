name: Compile NAVARA Pawn

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            g++ \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            cmake \
            make \
            git

      - name: Download Pawn Compiler
        run: |
          git clone --depth 1 https://github.com/pawn-lang/compiler.git pawncompiler

      - name: Build Pawn Compiler
        run: |
          cd pawncompiler/source/compiler

          mkdir -p build
          cd build

          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-m32" \
            -DCMAKE_CXX_FLAGS="-m32"

          cmake --build . --target pawncc -j2

          cd ../../../

          chmod +x ./pawncompiler/source/compiler/build/pawncc

      - name: Find mxINI
        run: |
          echo "Searching for mxINI.inc..."
          find . -type f -iname "mxini.inc" -print

      - name: Prepare includes
        run: |
          mkdir -p build_includes

          MXINI=$(find . -type f -iname "mxini.inc" | head -n 1)

          if [ -z "$MXINI" ]; then
            echo "ERROR: mxINI.inc was not found!"
            exit 1
          fi

          echo "Found mxINI:"
          echo "$MXINI"

          cp "$MXINI" ./build_includes/mxini.inc

      - name: Compile new.pwn
        run: |
          ./pawncompiler/source/compiler/build/pawncc \
            ./gamemodes/new.pwn \
            -i./pawno/include \
            -i./build_includes \
            -i./gamemodes \
            -i. \
            -Z \
            -o./gamemodes/new.amx

      - name: Check AMX
        run: |
          echo "========================================"
          echo "        NAVARA BUILD SUCCESSFUL"
          echo "========================================"
          echo ""
          ls -lh ./gamemodes/new.amx
          file ./gamemodes/new.amx

      - name: Upload new.amx
        uses: actions/upload-artifact@v4
        with:
          name: NAVARA-new-amx
          path: ./gamemodes/new.amx
